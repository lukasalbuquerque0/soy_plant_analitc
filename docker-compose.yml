services:
  # 1. O seu serviço de API (FastAPI + YOLO)
  api:
    build: . # Constrói a imagem usando o Dockerfile na pasta atual
    container_name: tcc_api
    restart: always
    ports:
      - "8000:8000" # Mapeia a porta 8000 do seu PC para a porta 8000 do contêiner
    volumes:
      - ./processed_videos:/app/processed_videos
      - ./temp_uploads:/app/temp_uploads
    environment:
      # Define o host do banco de dados (o nome do outro serviço)
      - DB_HOST=db
      - DB_USER=${DB_USER}       # Lê do seu arquivo .env
      - DB_PASSWORD=${DB_PASSWORD} # Lê do seu arquivo .env
      - DB_NAME=${DB_NAME}         # Lê do seu arquivo .env
      - DB_PORT=${DB_PORT}         # Lê do seu arquivo .env
    depends_on:
      - db # Diz ao Docker para iniciar o 'db' antes de iniciar a 'api'

  # 2. O seu serviço de Banco de Dados
  db:
    image: postgres:15-alpine # Usa uma imagem oficial do Postgres
    container_name: tcc_db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}       # Lê do seu arquivo .env
      - POSTGRES_PASSWORD=${DB_PASSWORD} # Lê do seu arquivo .env
      - POSTGRES_DB=${DB_NAME}         # Lê do seu arquivo .env
    ports:
      - "5200:5432" # Mapeia a porta 5200 do seu PC para a porta 5432 do Postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data # Garante que os dados do banco sobrevivam

volumes:
  postgres_data: # Define o volume de dados aqui